<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="БЕЛТЕХОСМОТР — государственный технический осмотр. Новости, диагностические станции, онлайн-запись и оплата.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="БЕЛТЕХОСМОТР">
  <meta name="theme-color" content="#333381">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>БЕЛТЕХОСМОТР</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #F2F2F5;
      overscroll-behavior: none;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #F2F2F5 0%, #E4E4F7 50%, #F2F2F5 100%);
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading .logo {
      width: 96px;
      height: 96px;
      border-radius: 28px;
      background: linear-gradient(135deg, #4F46E5, #7C3AED);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(79, 70, 229, 0.35);
      animation: pulse 1.6s ease-in-out infinite;
    }
    #loading .logo svg {
      width: 48px;
      height: 48px;
      fill: #fff;
    }
    #loading .title {
      margin-top: 20px;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #333381;
    }
    #loading .subtitle {
      margin-top: 6px;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      font-size: 13px;
      color: #6E6E73;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    flutter-view {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M12 2L4 5v6c0 5.55 3.84 10.74 8 12 4.16-1.26 8-6.45 8-12V5l-8-3z"/></svg>
    </div>
    <div class="title">БЕЛТЕХОСМОТР</div>
    <div class="subtitle">Вместе к безопасности</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.classList.add('hidden');
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
